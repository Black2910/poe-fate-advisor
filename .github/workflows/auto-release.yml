name: Auto-release tested version
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: fate-advisor-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Read current version and check existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(python -c 'import json;print(json.load(open("version.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install test dependencies
        if: steps.check.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        if: steps.check.outputs.exists == 'false'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Build release archive and SHA-256
        if: steps.check.outputs.exists == 'false'
        env:
          RELEASE_TAG: v${{ steps.check.outputs.version }}
        run: python scripts/build_release.py
      - name: Publish GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: PoE Fate Advisor v${{ steps.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/PoE_Fate_Advisor_v${{ steps.check.outputs.version }}.zip
            dist/SHA256SUMS.txt
